<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>GPS Tester</title>
    <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Crect width='32' height='32' rx='7' fill='%230a0d13'/%3E%3Ccircle cx='16' cy='16' r='9' fill='none' stroke='%2322d3ee' stroke-width='2'/%3E%3Ccircle cx='16' cy='16' r='3' fill='%2322d3ee'/%3E%3C/svg%3E" />
    <script type="module" src="/src/main.ts"></script>
  </head>
  <body>
    <header class="topbar">
      <div class="brand">
        <span class="brand-mark" aria-hidden="true"></span>
        <div class="brand-text">
          <h1>GPS Tester</h1>
          <p>u-blox NMEA monitor &middot; WebSerial &middot; Web Bluetooth</p>
        </div>
      </div>
      <div class="topbar-actions">
        <span id="deviceName" class="device-name" hidden></span>
        <label class="control">
          Baud
          <select id="baud"></select>
        </label>
        <div id="connBadge" class="pill pill-off">
          <span class="dot" id="actDot"></span>
          <span id="connText">Disconnected</span>
        </div>
        <button id="connectBtn" class="btn btn-primary" type="button">Connect</button>
        <button id="bleBtn" class="btn" type="button" title="Bluetooth LE (Web Bluetooth)">BLE</button>
        <button id="simBtn" class="btn" type="button">Simulate</button>
      </div>
    </header>
    <div id="banner" class="banner" hidden></div>
    <main class="layout">
      <section class="sidebar">
        <div class="card">
          <div class="card-title">Fix</div>
          <div id="fixLabel" class="fix-label nofix">No Fix</div>
          <div id="fixDetail" class="fix-detail">Waiting for signal…</div>
        </div>
        <div class="card">
          <div class="card-title">Position</div>
          <dl class="kv">
            <dt>Latitude</dt>
            <dd id="lat">—</dd>
            <dt>Longitude</dt>
            <dd id="lon">—</dd>
            <dt>Altitude</dt>
            <dd id="alt">—</dd>
            <dt>HDOP</dt>
            <dd id="hdop">—</dd>
          </dl>
        </div>
        <div class="card">
          <div class="card-title">Motion</div>
          <dl class="kv">
            <dt>Speed</dt>
            <dd id="speed">—</dd>
            <dt>Knots</dt>
            <dd id="knots">—</dd>
            <dt>Course</dt>
            <dd id="course">—</dd>
          </dl>
        </div>
        <div class="card">
          <div class="card-title">Satellites</div>
          <div id="satCounts" class="sat-counts">0 used · 0 in view</div>
          <canvas id="skyplot"></canvas>
        </div>
      </section>
      <section class="map-wrap">
        <div id="map"></div>
        <label class="follow-toggle">
          <input type="checkbox" id="follow" checked />
          Follow
        </label>
      </section>
      <section class="sidebar right">
        <div class="card">
          <div class="card-title">Feed</div>
          <dl class="kv">
            <dt>Traffic</dt>
            <dd id="traffic">Idle</dd>
            <dt>UTC</dt>
            <dd id="feedTime">—</dd>
            <dt>Last message</dt>
            <dd id="feedLast">—</dd>
            <dt>Received</dt>
            <dd id="feedCount">0</dd>
            <dt>Errors</dt>
            <dd id="feedErrors">0</dd>
          </dl>
        </div>
        <div class="card raw-card" id="rawCard">
          <button class="card-title card-toggle" id="rawToggle" type="button">
            Raw NMEA
            <span class="chevron">▸</span>
          </button>
          <pre id="rawLog" hidden></pre>
        </div>
      </section>
    </main>
  </body>
</html>
